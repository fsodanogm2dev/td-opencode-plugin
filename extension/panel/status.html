<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TD-Plugin guards</title>
    <style>
      html, body { margin: 0; }
      body {
        font-family: var(--oc-font, system-ui, sans-serif);
        color: var(--oc-fg, inherit);
        background: transparent;
        font-size: 12.5px;
        line-height: 1.4;
        -webkit-font-smoothing: antialiased;
      }
      #status-root { box-sizing: border-box; display: grid; gap: 4px; padding: 4px 10px 6px; }
      p, ul { margin: 0; padding: 0; }
      .st-list { list-style: none; display: grid; gap: 4px; }
      .st-item { display: flex; align-items: center; gap: 8px; min-height: 24px; }
      .st-dot {
        flex: none; width: 7px; height: 7px; border-radius: 2px;
        background: var(--oc-primary, currentColor);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--oc-primary, gray) 22%, transparent);
      }
      .st-text { flex: 1 1 auto; min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 6px; }
      .st-label { font-weight: 600; overflow-wrap: anywhere; }
      .st-meta { color: var(--oc-muted, gray); font-size: 11.5px; }
      .st-btn { flex: none; display: inline-flex; }
      .st-muted { color: var(--oc-muted, gray); font-size: 12px; }
      .st-line { font-size: 12px; }
      .st-line[data-tone="error"] { color: var(--oc-error-text, inherit); }
      .st-line[data-tone="warning"] { color: var(--oc-warning-text, inherit); }
    </style>
  </head>
  <body>
    <main id="status-root" aria-label="Active guards"></main>
    <script src="status.js"></script>
  </body>
</html>
