<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FueliX plugin status</title>
    <style>
      html, body { margin: 0; min-height: 100%; }
      body {
        font-family: var(--oc-font, system-ui, sans-serif);
        color: var(--oc-fg, inherit);
        background: var(--oc-bg, transparent);
        font-size: 13px;
        line-height: 1.45;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 14px;
        min-height: 100vh;
        padding: 14px 14px 16px;
        max-width: 640px;
      }
      p, h1, h2, h3, dl, dd, ul { margin: 0; padding: 0; }
      .sr-only {
        position: absolute; width: 1px; height: 1px; overflow: hidden;
        clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
      }

      /* Header */
      .hdr { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
      .hdr-text { min-width: 0; display: grid; gap: 1px; }
      .hdr-title {
        font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
        color: var(--oc-muted, gray);
      }
      .hdr-place { font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
      .hdr-path {
        font-family: var(--oc-mono, monospace); font-size: 11px; color: var(--oc-muted, gray);
        overflow-wrap: anywhere;
      }
      .hdr-badge { flex: none; padding-top: 2px; }

      /* Content */
      .content { display: grid; gap: 12px; }
      .slot.center { display: flex; justify-content: center; padding: 24px 0; }
      .sec {
        display: grid; gap: 6px;
        padding: 12px;
        border: 1px solid var(--oc-border, rgba(127,127,127,.25));
        border-radius: var(--oc-radius, 9px);
        background: var(--oc-elevated, transparent);
      }
      .sec-title {
        font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
        color: var(--oc-muted, gray);
      }
      .headline {
        display: flex; align-items: baseline; gap: 8px;
        font-size: 15px; font-weight: 600; line-height: 1.3;
      }
      .dot {
        flex: none; width: 8px; height: 8px; border-radius: 50%;
        background: var(--oc-muted, gray); transform: translateY(-1px);
      }
      .headline[data-tone="success"] .dot { background: var(--oc-success, green); }
      .headline[data-tone="warning"] .dot { background: var(--oc-warning, orange); }
      .headline[data-tone="error"] .dot { background: var(--oc-error, red); }
      .headline[data-tone="error"] { color: var(--oc-error-text, inherit); }
      .summary { font-weight: 600; }
      .meta, .row-sub, .row-meta { color: var(--oc-muted, gray); font-size: 12px; }
      .note { font-size: 12.5px; }
      time { font-variant-numeric: tabular-nums; }

      /* Model groups */
      .group { display: grid; gap: 4px; margin-top: 4px; }
      .group-title { font-size: 12px; font-weight: 600; }
      .fold-summary { cursor: pointer; list-style-position: inside; }
      .fold-summary .group-title { display: inline; }
      .fold[open] .chips { margin-top: 4px; }
      .chips { list-style: none; display: flex; flex-wrap: wrap; gap: 4px; }
      .chip {
        font-family: var(--oc-mono, monospace); font-size: 11.5px;
        padding: 1px 6px; border-radius: calc(var(--oc-radius, 9px) - 4px);
        background: var(--oc-muted-surface, rgba(127,127,127,.12));
        overflow-wrap: anywhere;
      }

      /* Providers */
      .rows { list-style: none; display: grid; gap: 6px; margin-top: 4px; }
      .row { display: grid; gap: 1px; }
      .row-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
      .mono { font-family: var(--oc-mono, monospace); font-size: 12px; overflow-wrap: anywhere; }
      .row-meta { flex: none; font-variant-numeric: tabular-nums; }

      /* Setup facts */
      .facts { display: grid; gap: 0; margin-top: 2px; }
      .fact {
        display: grid; grid-template-columns: minmax(96px, 38%) 1fr; gap: 1px 12px;
        padding: 8px 0;
        border-top: 1px solid var(--oc-border, rgba(127,127,127,.2));
      }
      .fact:first-child { border-top: 0; padding-top: 2px; }
      .fact:last-child { padding-bottom: 0; }
      .fact-label { font-size: 12.5px; font-weight: 600; }
      .fact-value { font-size: 12.5px; overflow-wrap: anywhere; }
      .fact-value[data-tone="warning"] { color: var(--oc-warning-text, inherit); }
      .fact-value[data-tone="error"] { color: var(--oc-error-text, inherit); }
      .fact-help {
        grid-column: 1 / -1; margin-top: 3px;
        color: var(--oc-muted, gray); font-size: 11.5px; line-height: 1.4;
      }
      @media (max-width: 300px) {
        .fact { grid-template-columns: 1fr; }
      }

      .source, .path { color: var(--oc-muted, gray); font-size: 11.5px; }
      .path { font-family: var(--oc-mono, monospace); overflow-wrap: anywhere; }

      /* Footer */
      .ftr {
        margin-top: auto; display: grid; gap: 6px; justify-items: start;
        padding-top: 12px; border-top: 1px solid var(--oc-border, rgba(127,127,127,.25));
      }
      .ftr-hint { color: var(--oc-muted, gray); font-size: 11.5px; }

      @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
    </style>
  </head>
  <body>
    <main id="root" aria-label="FueliX plugin status"></main>
    <script src="main.js"></script>
  </body>
</html>
