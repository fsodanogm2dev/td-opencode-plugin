name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test test/unit
      - run: cd extension && bun install --frozen-lockfile
      - run: bun run extension:typecheck
      - run: bun run extension:test
      - run: bun run extension:build
      - run: bun run extension:check
